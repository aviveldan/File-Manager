name: Build, Test, and Artifact

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK and Test APK
        run: ./gradlew assembleFossDebug assembleFossDebugAndroidTest

      - name: Enable KVM (Hardware Acceleration for Linux Runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            # Install the app and grant MANAGE_EXTERNAL_STORAGE before running tests
            adb install -r app/build/outputs/apk/foss/debug/*.apk
            adb shell appops set org.fossify.filemanager.debug MANAGE_EXTERNAL_STORAGE allow

            # Launch the app and wait for it to fully render (splash + main activity)
            adb shell am start -n org.fossify.filemanager.debug/org.fossify.filemanager.activities.SplashActivity
            sleep 5
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/app-launched.png

            # Run the instrumented tests
            ./gradlew connectedFossDebugAndroidTest

            # Re-launch and capture a post-test screenshot
            adb shell am start -n org.fossify.filemanager.debug/org.fossify.filemanager.activities.SplashActivity
            sleep 5
            adb exec-out screencap -p > screenshots/after-tests.png

      - name: Upload Emulator Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: screenshots/

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossify-filemanager-debug-apk
          path: app/build/outputs/apk/foss/debug/**/*.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/connected/
