name: Build, Test, and Artifact

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK and Test APK
        run: ./gradlew assembleFossDebug assembleFossDebugAndroidTest

      - name: Run Unit Tests
        run: ./gradlew testFossDebugUnitTest

      - name: Enable KVM (Hardware Acceleration for Linux Runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Dummy Model for CI
        run: |
          # Download a tiny, stripped-down test model to avoid OOM in CI
          wget -O dummy_gemma.task "https://storage.googleapis.com/mediapipe-tasks/genai/test_data/dummy_gemma.task" || true
          # Fallback: if public dummy doesn't exist, create a mock file so tests fail gracefully rather than crashing runner
          if [ ! -s dummy_gemma.task ]; then echo "mock_data" > dummy_gemma.task; fi

      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            # Push the dummy model to the emulator's temp directory
            adb push dummy_gemma.task /data/local/tmp/dummy_gemma.task
            # Install the app and grant MANAGE_EXTERNAL_STORAGE before running tests
            adb install -r app/build/outputs/apk/foss/debug/*.apk
            adb shell appops set org.fossify.filemanager.debug MANAGE_EXTERNAL_STORAGE allow
            ./gradlew connectedFossDebugAndroidTest

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossify-filemanager-debug-apk
          path: app/build/outputs/apk/foss/debug/**/*.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/connected/

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
